plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.example.np_team_k'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.np_team_k"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    buildFeatures {
        dataBinding true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // DataStore Preferences
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // LiveDataReactiveStreams 변환용
    implementation "androidx.lifecycle:lifecycle-reactivestreams:2.6.1"

    // Kotlin Coroutines (DataStore 내부에서 사용됨 - Java 프로젝트도 필요)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // Flow → Publisher 변환용
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.7.3"

    implementation 'com.google.android.gms:play-services-maps:18.1.0'//google maps SDK

    implementation libs.core.ktx// kakao SDK
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation "com.kakao.sdk:v2-user:2.17.0" // kakao SDK

    testImplementation libs.junit
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'//add Glide
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Retrofit 라이브러리
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp 클라이언트 (Retrofit과 함께 사용)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'



}